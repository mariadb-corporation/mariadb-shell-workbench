# Multi-user MariaDB Shell Workbench on @HOST@ (setup-workbench.sh fills in @HOST@ and
# @FRAME_ANCESTORS@).
# Every IDE request is checked by the spawner (auth_request): logged in through oauth2-proxy and
# Keycloak, in group workbench-users, Linux account present, IDE running. The answer names the
# user, and the request goes straight to that user's Theia socket. webview.@HOST@ is Theia's
# webview origin (THEIA_WEBVIEW_EXTERNAL_ENDPOINT=webview.{{hostname}}): same check, same cookie
# (domain .@HOST@), same user's socket.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @HOST@ webview.@HOST@;

    ssl_certificate     /etc/letsencrypt/live/@HOST@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@HOST@/privkey.pem;
    # Who may frame the IDE: the origins in FRAME_ANCESTORS (a cloud console with a userscript),
    # and the IDE itself, which frames the webviews of webview.@HOST@. A location with an add_header of its own
    # does not inherit these: location / repeats them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://@HOST@ @FRAME_ANCESTORS@" always;

    location /sso/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    location = /_workbench_auth {
        internal;
        proxy_pass http://unix:/run/mariadb-shell-workbench/spawner.sock:/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        # The first request of a user waits for the account and the IDE to start.
        proxy_read_timeout 150s;
    }

    location / {
        auth_request /_workbench_auth;
        auth_request_set $workbench_user $upstream_http_x_workbench_user;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://@HOST@ @FRAME_ANCESTORS@" always;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        error_page 500 502 503 504 = @unavailable;

        proxy_pass http://unix:/run/mariadb-shell-workbench/$workbench_user/theia.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Theia talks to its backend over a WebSocket that stays open.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
        client_max_body_size 64M;
        # Inside the console's iframe every request is cross-site: Firefox drops Strict and Lax
        # cookies there, Theia's connection token (and with it every webview) included.
        proxy_cookie_flags theia-connection-token samesite=none secure;
    }

    location @login {
        return 302 https://@HOST@/oauth2/start?rd=https://$host$request_uri;
    }

    location @forbidden {
        default_type text/plain;
        return 403 "This account may not use the MariaDB Shell Workbench on this server.\n";
    }

    location @unavailable {
        default_type text/plain;
        return 503 "Your MariaDB Shell Workbench could not be started, please retry in a minute.\n";
    }
}
