# MariaDB Shell Workbench for one user on @HOST@ (setup-workbench.sh fills in @HOST@ and
# @FRAME_ANCESTORS@). Keycloak under /sso; everything else goes through oauth2-proxy
# (127.0.0.1:4180, realm "workbench"), which forwards to Theia on 127.0.0.1:3000.
# webview.@HOST@ is the origin Theia serves extension webviews from
# (THEIA_WEBVIEW_EXTERNAL_ENDPOINT=webview.{{hostname}}): same backend, same login cookie
# (domain .@HOST@).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @HOST@ webview.@HOST@;

    ssl_certificate     /etc/letsencrypt/live/@HOST@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@HOST@/privkey.pem;
    # Who may frame the IDE: the origins in FRAME_ANCESTORS (a cloud console with a userscript),
    # and the IDE itself, which frames the webviews of webview.@HOST@.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://@HOST@ @FRAME_ANCESTORS@" always;

    location /sso/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;

        # Theia talks to its backend over a WebSocket that stays open.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
        client_max_body_size 64M;

        # Inside a console's iframe every request is cross-site: Firefox drops Strict and Lax
        # cookies there, Theia's connection token (and with it every webview) included.
        proxy_cookie_flags theia-connection-token samesite=none secure;
        proxy_hide_header X-Frame-Options;

        error_page 502 503 504 = @unavailable;
    }

    location @unavailable {
        default_type text/plain;
        return 503 "The MariaDB Shell Workbench is not running, please retry in a minute.\n";
    }
}
